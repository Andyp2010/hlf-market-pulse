name: Update HLF Pulse Data & Deploy Pages

on:
  schedule:
    - cron: "15 18 * * *" # Runs daily at 18:15 UTC (07:15 NZDT / 06:15 NZST)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update_pulse.py"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "hlf-pulse-build-and-deploy"
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with Git history for baseline recovery)
        uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Camoufox browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-v1

      - name: Install Python dependencies & Camoufox
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml openpyxl pandas pypdf "camoufox[geoip]" playwright
          python -m camoufox fetch
          playwright install chromium

      - name: Sanitize non-breaking spaces & run HLF Pulse live data builder
        run: |
          python -c "import pathlib; p=pathlib.Path('update_pulse.py'); p.write_text(p.read_text('utf-8').replace('\u00a0', ' '), 'utf-8')"
          python update_pulse.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            COMMIT_MSG="Auto-update HLF Pulse dataset & canonical pages ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git commit -m "$COMMIT_MSG"
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort || true
              git fetch origin main
              git reset --soft origin/main
              git add -A
              git commit -m "$COMMIT_MSG"
            fi
            git push origin HEAD:main
          else
            echo "No data changes to commit."
          fi

      - name: Prepare clean Pages directory
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='_site' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.py' \
            --exclude='*.xlsx' \
            --exclude='*.pdf' \
            --exclude='tmp_*' \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
