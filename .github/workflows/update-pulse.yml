name: Update NZ Mortgage & Housing Pulse

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.xlsx'
      - '*.csv'
      - 'update_pulse.py'
      - 'update_fhb_benchmark.py'
      - '.github/workflows/update-pulse.yml'
  schedule:
    # Runs Mon, Wed, Fri at 02:35 UTC (3:35 PM NZDT / 2:35 PM Fiji) to catch:
    # - Stats NZ Building Consents (~1st-4th), Tenancy Services (~10th-15th),
    # - IRD KiwiSaver (~18th-22nd), Stats NZ CPI (~20th-24th), and RBNZ C31-C41/B30 (~25th-29th).
    - cron: '35 2 * * 1,3,5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-pulse:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install 3-tier browser & Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libasound2t64 libx11-xcb1 || sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests curl_cffi "camoufox[geoip]" playwright pypdf
          python -m camoufox fetch
          python -m playwright install --with-deps chromium

      - name: Fetch RBNZ, Stats NZ, Tenancy & IRD data
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python update_pulse.py
          if [ -f update_fhb_benchmark.py ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python update_fhb_benchmark.py
          fi
          touch .nojekyll

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Auto-update HLF Pulse dataset & canonical pages ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
