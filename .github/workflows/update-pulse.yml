name: Update HLF Pulse Data & Deploy Pages

on:
  schedule:
    - cron: "17 18 * * *" # Runs daily at 18:17 UTC (07:17 NZDT / 06:17 NZST)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update_pulse.py"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "hlf-pulse-build-and-deploy"
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with Git history for baseline recovery)
        uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Camoufox browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-v1

      - name: Install Python dependencies, Playwright & Camoufox (with GITHUB_TOKEN auth)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi beautifulsoup4 lxml openpyxl pandas pypdf "camoufox[geoip]" playwright
          playwright install chromium
          python -c "
          import os, requests, sys, runpy
          tok = os.environ.get('GITHUB_TOKEN')
          if tok:
              _orig_req = requests.Session.request
              def _auth_req(self, method, url, *a, **kw):
                  if 'api.github.com' in str(url):
                      h = dict(kw.get('headers') or {})
                      h.setdefault('Authorization', f'Bearer {tok}')
                      kw['headers'] = h
                  return _orig_req(self, method, url, *a, **kw)
              requests.Session.request = _auth_req
          sys.argv = ['camoufox', 'fetch']
          try:
              runpy.run_module('camoufox', run_name='__main__')
          except SystemExit as e:
              if e.code not in (0, None):
                  print(f'Camoufox fetch note (exit {e.code}) — using cached binary or Playwright fallback.')
          except Exception as e:
              print(f'Camoufox fetch note ({e}) — using cached binary or Playwright fallback.')
          "

      - name: Sanitize non-breaking spaces & run HLF Pulse live data builder
        run: |
          python -c "import pathlib; p=pathlib.Path('update_pulse.py'); p.write_text(p.read_text('utf-8').replace('\u00a0', ' '), 'utf-8')"
          python update_pulse.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            COMMIT_MSG="Auto-update HLF Pulse dataset & canonical pages ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git commit -m "$COMMIT_MSG"
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort || true
              git fetch origin main
              git reset --soft origin/main
              git add -A
              git commit -m "$COMMIT_MSG"
            fi
            git push origin HEAD:main
          else
            echo "No data changes to commit."
          fi

      - name: Prepare clean Pages directory
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='_site' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.py' \
            --exclude='*.xlsx' \
            --exclude='*.pdf' \
            --exclude='tmp_*' \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
